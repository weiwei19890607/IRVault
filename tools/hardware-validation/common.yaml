substitutions:
  device_name: irvault-phase0
  friendly_name: IRVault Phase 0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0
  libraries:
    # ESPHome 2026.x selectively compiles Arduino libraries. M5PM1/M5GFX need
    # these headers even though their buses are owned by M5Unified.
    - Wire
    - SPI
    - M5Unified=https://github.com/m5stack/M5Unified.git#0.2.18

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # StickS3 exposes the ESP32-S3 built-in USB Serial/JTAG interface.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      # The Phase 0 test network is hidden. This avoids repeated full scans
      # followed by RETRY_HIDDEN before association.
      hidden: true
  ap:
    ssid: "IRVault Phase0 Fallback"
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: components
